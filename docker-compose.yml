services:
  db:
    image: postgres:15-alpine
    ports:
      - "4444:5432" # Maps your requested port 4444 to the DB. Connect your SQL viewer to localhost:4444!
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: local_supabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_supabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3333:3333" # Next.js accessible at localhost:3333
    volumes:
      - .:/app
      - /app/node_modules # Prevents your local machine's node_modules from conflicting with the container's
      - /app/.next       # Keeps Next.js build cache inside the container
    environment:
      - DATABASE_URL=postgresql://postgres:local_dev_password@db:5432/local_supabase
      
      - DIRECT_URL=postgresql://postgres:local_dev_password@db:5432/local_supabase
      
    depends_on:
      db:
        condition: service_healthy
        
volumes:
  postgres_data:
  planka_db_data:
  planka_user_data: